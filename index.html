<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beranda | Goresan Tulis</title>
  <meta name="description"
    content="Goresan Tulis - toko alat tulis online: buku, pena, perlengkapan kantor, dan alat seni.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f3d3d9;
      --ink: #111;
      --rose: #e6b3bd;
      --rose2: #d98a9a;
      --soft: #fbeff1;
      --line: #f0e0e3;
      --muted: #665a5d;
      --danger: #c0392b;
      --ok: #2e7d5b;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "DM Sans", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      font-family: var(--sans);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit
    }

    input,
    textarea,
    select {
      font-family: inherit;
      font-size: 1rem
    }

    ul {
      list-style: none
    }

    svg.ico {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block
    }

    i[data-i] {
      display: inline-flex
    }

    .shell {
      width: min(1240px, 100% - 32px);
      margin: 28px auto;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .frame {
      background: #fff;
      border-radius: 34px;
      padding: 10px
    }

    .btn-black {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px 38px;
      background: #000;
      color: #fff;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      transition: transform .25s, background .25s
    }

    .btn-black:hover {
      background: #333;
      transform: translateY(-2px)
    }

    .btn-black.sm {
      padding: 10px 20px;
      font-size: 13px
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px 34px;
      border: 1.5px solid #111;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      transition: background .25s, color .25s, transform .25s
    }

    .btn-ghost:hover {
      background: #111;
      color: #fff;
      transform: translateY(-2px)
    }

    .btn-ghost.sm {
      padding: 9px 16px;
      font-size: 13px
    }

    .btn-block {
      width: 100%
    }

    .topnav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 30px;
      position: relative
    }

    .menu {
      display: flex;
      gap: 30px;
      align-items: center
    }

    .menu a {
      font-size: 14px;
      padding: 4px 0;
      border-bottom: 1.5px solid transparent;
      transition: opacity .2s, border-color .2s
    }

    .menu a:hover {
      opacity: .55
    }

    .menu a.active {
      border-color: #111
    }

    .cart {
      position: relative;
      width: 52px;
      height: 32px;
      display: grid;
      place-items: center;
      background: var(--rose);
      color: #fff;
      border-radius: 20px;
      font-size: 16px;
      transition: transform .2s, background .2s
    }

    .cart:hover {
      background: var(--rose2);
      transform: scale(1.06)
    }

    .cart .badge {
      position: absolute;
      top: -8px;
      right: -6px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 20px;
      background: #111;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      transition: transform .3s
    }

    .cart .badge.bump {
      transform: scale(1.4)
    }

    .menu-toggle {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      place-items: center;
      font-size: 20px
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 26px;
      position: relative
    }

    .bar .topnav {
      gap: 34px
    }

    .brand {
      font-family: var(--serif);
      font-size: 30px;
      letter-spacing: -.01em
    }

    .brand sup {
      font-size: 11px;
      font-family: var(--sans);
      margin-left: 2px
    }

    .hero-frame {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-height: 660px
    }

    .visual {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      min-height: 640px;
      background: linear-gradient(160deg, #e8a3b0 0%, #eba9b5 50%, #d98a9a 100%)
    }

    .visual>svg.art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .visual .logo {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: 26px
    }

    .visual .logo .brand {
      font-size: 28px
    }

    .visual .logo a:not(.brand) {
      font-size: 13px
    }

    .visual .cap {
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 2;
      font-family: var(--serif);
      font-size: 20px;
      color: #fff;
      background: rgba(17, 17, 17, .62);
      backdrop-filter: blur(6px);
      padding: 8px 18px;
      border-radius: 30px
    }

    .visual .buy {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 8px 18px;
      background: #fff;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      transition: background .2s
    }

    .visual .buy:hover {
      background: var(--soft)
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      padding: 18px 26px 28px
    }

    .hero-copy {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 10px
    }

    .display {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(44px, 5.4vw, 74px);
      line-height: 1.02;
      letter-spacing: -.02em;
      margin-bottom: 26px
    }

    .hero-copy p {
      max-width: 310px;
      font-size: 13px;
      line-height: 1.6;
      color: #222;
      margin-bottom: 36px
    }

    .hero-copy .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center
    }

    .sect {
      padding: 56px clamp(20px, 4vw, 52px)
    }

    .sect-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 34px
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--rose2);
      font-weight: 600;
      display: block;
      margin-bottom: 8px
    }

    h2.title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1.1;
      letter-spacing: -.01em
    }

    .link-arrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 1.5px solid #111;
      padding-bottom: 2px
    }

    .link-arrow:hover {
      opacity: .6
    }

    .cats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px
    }

    .cat {
      border-radius: 26px;
      padding: 26px 22px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      transition: transform .3s, box-shadow .3s
    }

    .cat:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .12)
    }

    .cat i {
      font-size: 38px
    }

    .cat h3 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 26px;
      line-height: 1.1
    }

    .cat span {
      font-size: 13px;
      opacity: .9
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px
    }

    .feat {
      background: var(--soft);
      border-radius: 26px;
      padding: 28px 24px
    }

    .feat i {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      display: inline-grid;
      place-items: center;
      font-size: 20px;
      margin-bottom: 18px
    }

    .feat h3 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 22px;
      margin-bottom: 6px
    }

    .feat p {
      font-size: 14px;
      color: var(--muted)
    }

    .cta {
      border-radius: 28px;
      background: #111;
      color: #fff;
      padding: 60px 30px;
      text-align: center
    }

    .cta h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(32px, 4.4vw, 54px);
      line-height: 1.08;
      margin-bottom: 14px
    }

    .cta p {
      color: #cfc4c7;
      margin-bottom: 28px
    }

    .cta .btn-black {
      background: var(--rose);
      color: #111
    }

    .cta .btn-black:hover {
      background: #fff
    }

    .page-top {
      padding: 44px clamp(20px, 4vw, 52px) 10px
    }

    .page-top h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1;
      letter-spacing: -.02em;
      margin: 6px 0 14px
    }

    .page-top p {
      color: var(--muted);
      max-width: 480px;
      font-size: 15px
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px
    }

    .search {
      position: relative;
      flex: 1 1 280px;
      max-width: 420px
    }

    .search i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--muted)
    }

    .search input {
      width: 100%;
      padding: 14px 18px 14px 46px;
      border: 1.5px solid var(--line);
      border-radius: 40px;
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    .search input:focus {
      border-color: var(--rose2);
      box-shadow: 0 0 0 4px rgba(217, 138, 154, .2)
    }

    .select {
      padding: 13px 20px;
      border: 1.5px solid var(--line);
      border-radius: 40px;
      background: #fff;
      outline: none;
      cursor: pointer
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1.5px solid var(--line);
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      transition: all .2s
    }

    .chip:hover {
      border-color: #111;
      transform: translateY(-2px)
    }

    .chip.active {
      background: #111;
      border-color: #111;
      color: #fff
    }

    .info {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 22px
    }

    .pcard {
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: transform .3s, box-shadow .3s
    }

    .pcard:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 44px rgba(0, 0, 0, .1)
    }

    .pimg {
      position: relative;
      aspect-ratio: 4/3;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, .95);
      font-size: 64px;
      margin: 8px;
      border-radius: 22px
    }

    .pimg svg.ico {
      stroke-width: 1.4;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .15));
      transition: transform .45s
    }

    .pcard:hover .pimg svg.ico {
      transform: scale(1.15) rotate(-6deg)
    }

    .ptag {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, .92);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #111
    }

    .pbody {
      padding: 10px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1
    }

    .pbody h3 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 22px;
      line-height: 1.15
    }

    .pbody p {
      font-size: 13.5px;
      color: var(--muted);
      flex: 1
    }

    .price {
      font-size: 18px;
      font-weight: 700
    }

    .pbtns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 70px 20px;
      color: var(--muted)
    }

    .empty i {
      font-size: 48px;
      color: var(--line);
      display: inline-grid;
      margin-bottom: 12px
    }

    .cgrid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 18px;
      padding: 0 10px 10px
    }

    .cinfo {
      background: var(--soft);
      border-radius: 28px;
      padding: 36px
    }

    .cform {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 36px
    }

    .cinfo h2,
    .cform h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 30px;
      margin-bottom: 6px
    }

    .cinfo>p,
    .cform>p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 26px
    }

    .irow {
      display: flex;
      gap: 14px;
      margin-bottom: 20px
    }

    .irow .ic {
      flex: 0 0 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      transition: background .25s, color .25s
    }

    .irow:hover .ic {
      background: #111;
      color: #fff
    }

    .irow b {
      display: block;
      font-weight: 600
    }

    .irow span {
      color: var(--muted);
      font-size: 14px
    }

    .socials {
      display: flex;
      gap: 10px;
      margin-top: 8px
    }

    .socials a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      transition: background .25s, color .25s, transform .25s
    }

    .socials a:hover {
      background: #111;
      color: #fff;
      transform: translateY(-3px)
    }

    .field {
      margin-bottom: 18px
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 7px
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--line);
      border-radius: 18px;
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    .field textarea {
      min-height: 150px;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--rose2);
      box-shadow: 0 0 0 4px rgba(217, 138, 154, .2)
    }

    .field .err {
      display: none;
      color: var(--danger);
      font-size: 12.5px;
      margin-top: 5px
    }

    .field.bad input,
    .field.bad textarea {
      border-color: var(--danger)
    }

    .field.bad .err {
      display: block
    }

    .ok {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 18px;
      background: #e5f4ec;
      color: var(--ok);
      font-weight: 500
    }

    .ok.show {
      display: flex;
      animation: pop .4s
    }

    .foot {
      padding: 44px clamp(20px, 4vw, 52px) 24px
    }

    .fgrid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1.3fr;
      gap: 34px;
      padding-bottom: 32px
    }

    .fgrid.three {
      grid-template-columns: 1.6fr 1fr 1fr
    }

    .foot h4 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 20px;
      margin-bottom: 14px
    }

    .foot li,
    .foot p {
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--muted)
    }

    .foot li a:hover {
      color: #111;
      text-decoration: underline
    }

    .foot li i {
      margin-right: 8px;
      vertical-align: -3px;
      color: #111
    }

    .copy {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-align: center
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 20, 26, .45);
      opacity: 0;
      visibility: hidden;
      transition: .3s;
      z-index: 90
    }

    .overlay.open {
      opacity: 1;
      visibility: visible
    }

    .drawer {
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: min(430px, calc(100% - 24px));
      background: #fff;
      border-radius: 30px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateX(115%);
      transition: transform .38s cubic-bezier(.2, .8, .2, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2)
    }

    .drawer.open {
      transform: none
    }

    .dhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 26px;
      border-bottom: 1px solid var(--line)
    }

    .dhead h3 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 26px
    }

    .dclose {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: var(--soft)
    }

    .dbody {
      flex: 1;
      overflow-y: auto;
      padding: 12px 26px
    }

    .cempty {
      text-align: center;
      color: var(--muted);
      padding: 70px 10px
    }

    .cempty i {
      font-size: 48px;
      color: var(--line);
      display: inline-grid;
      margin-bottom: 12px
    }

    .citem {
      display: grid;
      grid-template-columns: 62px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      animation: pop .3s
    }

    .cthumb {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 26px
    }

    .citem h4 {
      font-size: 14.5px;
      font-weight: 600
    }

    .citem .u {
      font-size: 13px;
      color: var(--muted)
    }

    .qty {
      display: inline-flex;
      align-items: center;
      margin-top: 6px;
      border: 1.5px solid var(--line);
      border-radius: 30px
    }

    .qty button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: 700
    }

    .qty button:hover {
      background: var(--soft)
    }

    .qty span {
      min-width: 22px;
      text-align: center;
      font-size: 14px;
      font-weight: 600
    }

    .cright {
      text-align: right
    }

    .cright b {
      display: block;
      font-size: 14.5px
    }

    .rm {
      color: var(--danger);
      font-size: 12px;
      margin-top: 6px;
      display: inline-flex;
      gap: 4px;
      align-items: center
    }

    .dfoot {
      padding: 20px 26px 26px;
      border-top: 1px solid var(--line)
    }

    .trow {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px
    }

    .dfoot .btn-black,
    .dfoot .btn-ghost {
      width: 100%
    }

    .dfoot .btn-ghost {
      margin-top: 10px
    }

    .toasts {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      pointer-events: none
    }

    .toast {
      background: #111;
      color: #fff;
      padding: 13px 22px;
      border-radius: 40px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .25);
      animation: tin .35s, tout .35s 2.4s forwards
    }

    .toast i {
      color: var(--rose);
      font-size: 18px
    }

    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .7s ease, transform .7s ease
    }

    .reveal.in {
      opacity: 1;
      transform: none
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.95)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes tin {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes tout {
      to {
        opacity: 0;
        transform: translateY(10px)
      }
    }

    @keyframes drift {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-10px)
      }
    }

    .art .d1 {
      animation: drift 6s ease-in-out infinite
    }

    .art .d2 {
      animation: drift 7s ease-in-out infinite .8s
    }

    .art .d3 {
      animation: drift 8s ease-in-out infinite .3s
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }

      .reveal {
        opacity: 1;
        transform: none
      }
    }

    @media (max-width:980px) {
      .hero-frame {
        grid-template-columns: 1fr
      }

      .visual {
        min-height: 420px
      }

      .cats,
      .features {
        grid-template-columns: repeat(2, 1fr)
      }

      .cgrid {
        grid-template-columns: 1fr
      }

      .fgrid,
      .fgrid.three {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (max-width:760px) {
      .menu-toggle {
        display: grid
      }

      .menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        left: auto;
        min-width: 190px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 14px 20px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, .12);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: .25s;
        z-index: 30
      }

      .menu.open {
        opacity: 1;
        visibility: visible;
        transform: none
      }

      .menu a {
        padding: 9px 0;
        width: 100%
      }

      .topnav {
        gap: 12px
      }

      .bar {
        padding: 12px 16px
      }

      .frame {
        border-radius: 26px
      }

      .hero-side {
        padding: 14px 14px 26px
      }

      .sect {
        padding: 40px 18px
      }

      .cinfo,
      .cform {
        padding: 26px 22px
      }
    }

    @media (max-width:520px) {

      .cats,
      .features {
        grid-template-columns: 1fr
      }

      .fgrid,
      .fgrid.three {
        grid-template-columns: 1fr
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch
      }

      .search {
        max-width: none
      }

      .brand {
        font-size: 26px
      }
    }
  </style>
</head>
